spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authCircuit
                fallbackUri: forward:/fallback/auth
          metadata:
            response-timeout: 60000
        - id: product
          uri: ${PRODUCT_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/products/**
          filters:
            - name: CircuitBreaker
              args:
                name: productCircuit
                fallbackUri: forward:/fallback/product
          metadata:
            response-timeout: 60000
        - id: inventory
          uri: ${INVENTORY_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/inventory/**
          filters:
            - name: CircuitBreaker
              args:
                name: inventoryCircuit
                fallbackUri: forward:/fallback/inventory
          metadata:
            response-timeout: 60000
        - id: cart
          uri: ${CART_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/cart/**
          filters:
            - name: CircuitBreaker
              args:
                name: cartCircuit
                fallbackUri: forward:/fallback/cart
          metadata:
            response-timeout: 60000
        - id: order
          uri: ${ORDER_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderCircuit
                fallbackUri: forward:/fallback/order
          metadata:
            response-timeout: 60000
        - id: payment
          uri: ${PAYMENT_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: paymentCircuit
                fallbackUri: forward:/fallback/payment
          metadata:
            response-timeout: 60000
        - id: search
          uri: ${SEARCH_SERVICE_URI:http://localhost:8089}
          predicates:
            - Path=/api/search/**
          filters:
            - name: CircuitBreaker
              args:
                name: searchCircuit
                fallbackUri: forward:/fallback/search
          metadata:
            response-timeout: 60000
        - id: review
          uri: ${REVIEW_SERVICE_URI:http://localhost:8088}
          predicates:
            - Path=/api/reviews/**
          filters:
            - name: CircuitBreaker
              args:
                name: reviewCircuit
                fallbackUri: forward:/fallback/review
          metadata:
            response-timeout: 60000

server:
  port: 8080

app:
  gateway:
    api-version:
      required: v1
    rate-limit:
      # redis: try Redis first, fallback to in-memory if Redis unavailable
      # in-memory: use in-memory only (no Redis)
      mode: ${RATE_LIMIT_MODE:redis}
      max-requests: ${RATE_LIMIT_MAX_REQUESTS:1000}
      window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    auth:
      validate-url: ${AUTH_VALIDATE_URL:http://localhost:8081/api/auth/validate}
      validate-timeout-seconds: 15
  frontend-flags:
    beta-banner-enabled: true
    admin-console-enabled: false

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 60
        slowCallDurationThreshold: 2s
        permittedNumberOfCallsInHalfOpenState: 5
        waitDurationInOpenState: 20s
        automaticTransitionFromOpenToHalfOpenEnabled: true
      productExtended:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 70
        slowCallRateThreshold: 90
        slowCallDurationThreshold: 20s
        permittedNumberOfCallsInHalfOpenState: 5
        waitDurationInOpenState: 20s
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      authCircuit:
        baseConfig: default
      productCircuit:
        baseConfig: productExtended
      inventoryCircuit:
        baseConfig: default
      cartCircuit:
        baseConfig: default
      orderCircuit:
        baseConfig: default
      paymentCircuit:
        baseConfig: default
      searchCircuit:
        baseConfig: default
      reviewCircuit:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 60s
        cancelRunningFuture: true
      authExtended:
        timeoutDuration: 60s
        cancelRunningFuture: true
      productExtended:
        timeoutDuration: 60s
        cancelRunningFuture: true
    instances:
      authCircuit:
        baseConfig: authExtended
      productCircuit:
        baseConfig: productExtended
      inventoryCircuit:
        baseConfig: default
      cartCircuit:
        baseConfig: default
      orderCircuit:
        baseConfig: default
      paymentCircuit:
        baseConfig: default
      searchCircuit:
        baseConfig: default
      reviewCircuit:
        baseConfig: default

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
