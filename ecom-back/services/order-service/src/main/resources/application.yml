spring:
  application:
    name: order-service
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  inventory:
    reservation-ttl-minutes: 30
  saga:
    payment-timeout-minutes: 15
  outbox:
    max-retry: 5
  cleanup:
    fixed-delay: PT6H
    outbox-sent-retention: P7D
    outbox-failed-retention: P30D
    dedup-retention: P14D
  kafka:
    topics:
      order-created: order.created.v1
      order-timed-out: order.timed-out.v1
      inventory-reservation-failed: inventory.reservation.failed.v1
      payment-authorized: payment.authorized.v1
      payment-failed: payment.failed.v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${PORT:8086}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
