spring:
  application:
    name: inventory-service
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8084

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  outbox:
    max-retry: 5
  cleanup:
    fixed-delay: PT6H
    outbox-sent-retention: P7D
    outbox-failed-retention: P30D
    dedup-retention: P14D
  inventory:
    reservation-ttl-minutes: 30
    reservation-expiry-scan-delay: PT60S
    reservation-expiry-batch-size: 100
  kafka:
    topics:
      order-created: order.created.v1
      order-timed-out: order.timed-out.v1
      payment-authorized: payment.authorized.v1
      payment-failed: payment.failed.v1
      inventory-reserved: inventory.reserved.v1
      inventory-reservation-failed: inventory.reservation.failed.v1

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
