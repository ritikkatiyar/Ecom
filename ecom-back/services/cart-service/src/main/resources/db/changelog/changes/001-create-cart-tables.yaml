databaseChangeLog:
  - changeSet:
      id: 001-create-cart-item
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: cart_item
      changes:
        - createTable:
            tableName: cart_item
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: datetime(6)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: cart_item
            columnNames: user_id, product_id
            constraintName: uk_cart_user_product
        - createIndex:
            tableName: cart_item
            indexName: idx_cart_user
            columns:
              - column:
                  name: user_id

