spring:
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

app:
  search:
    product-service-base-url: ${PRODUCT_SERVICE_BASE_URL}

management:
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:}
