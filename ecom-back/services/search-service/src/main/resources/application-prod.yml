spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

app:
  search:
    product-service-base-url: ${PRODUCT_SERVICE_BASE_URL}
    solr:
      base-url: ${SOLR_BASE_URL}
      products-core: ${SOLR_PRODUCTS_CORE:products}
      dedup-core: ${SOLR_DEDUP_CORE:search_consumed_events}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
